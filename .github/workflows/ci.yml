name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Every push to main (and manual dispatch): run the unit suite.
  test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: cd app && swift test -v

  # Linux port suite (qt/): run on ubuntu-22.04 — the oldest supported build
  # host, so the whole port stays inside the compat floors (Qt 6.2+, SQLite
  # 3.35+ — jammy ships SQLite 3.37). Plan Task 1,
  # docs/superpowers/plans/2026-10-09-linux-qt-port.md.
  linux-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libsqlite3-dev pkg-config
      - name: Configure
        run: cmake -S qt -B qt/build
      - name: Build
        run: cmake --build qt/build
      - name: Run tests
        run: ctest --test-dir qt/build --output-on-failure

  # A tag push (v*) runs the suite, packages the app, and publishes a release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: cd app && swift test
      - name: Package the app
        run: scripts/make-app.sh
      - name: Zip (preserves bundle layout)
        run: |
          TAG="${GITHUB_REF_NAME}"
          ditto -c -k --keepParent "dist/BoH Librarian.app" "BoH-Librarian-${TAG}.zip"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" "BoH-Librarian-${TAG}.zip" \
            --title "BoH Librarian $TAG" \
            --generate-notes \
            --notes "macOS 14+. Ad-hoc signed personal build: on first launch, right-click the app and choose Open (or clear quarantine with \`xattr -cr \"BoH Librarian.app\"\`)."

  # Linux AppImage on tag pushes: build, test, package, attach to the release.
  linux-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libsqlite3-dev pkg-config file
      - name: Configure + build + test
        run: |
          cmake -S qt -B qt/build -DCMAKE_BUILD_TYPE=Release
          cmake --build qt/build -j"$(nproc)"
          ctest --test-dir qt/build --output-on-failure
      - name: Package AppImage
        env:
          LINUXDEPLOY_LOCAL: ""
        run: |
          export LINUXDEPLOY_TARBALL=1
          ARCH=x86_64 qt/packaging/make-appimage.sh || \
          (curl -L -o /tmp/linuxdeploy.AppImage \
             https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
           && chmod +x /tmp/linuxdeploy.AppImage \
           && LINUXDEPLOY_LOCAL=/tmp/linuxdeploy.AppImage ARCH=x86_64 qt/packaging/make-appimage.sh)
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" dist/*.AppImage --clobber
